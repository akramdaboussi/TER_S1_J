<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Labyrinthe – Génération</title>
    <link rel="stylesheet" href="./styles.css" />
</head>
<body>
<header>
    <h1>Générateur de labyrinthe</h1>
    <form id="controls">
        <label>Largeur <input id="width" type="number" value="30" min="5" max="200" required></label>
        <label>Hauteur <input id="height" type="number" value="30" min="5" max="200" required></label>
        <label>Imperfection <input id="imperfection" type="number" value="0.1" min="0" max="1" step="0.05" required></label>
        <button id="generate" type="submit">Générer</button>
    </form>
</header>

<main>
    <div id="legend">
        <span class="cell demo wall"></span> Mur
        <span class="cell demo solid"></span> Sol
        <span class="cell demo perm"></span> Mur permanent
        <span class="cell demo tunnel"></span> Tunnel
    </div>

    <div id="grid" aria-live="polite"></div>
</main>

<footer>
    <small>Source: API <code>/api/labyrinthe</code> (Spark Java)</small>
</footer>

<script src="./app.js" type="module"></script>
</body>
</html>
